name: Site

# Builds the Jekyll site in site/ and the data files from data/datasets. It is not deployed yet;
# publishing to GitHub Pages is part of the cutover (#105).
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No LFS: the site's own images are stored normally, and the old
      # versions/ images (several GB in LFS) are not needed to build it.
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site

      - name: Build
        working-directory: site
        run: bundle exec jekyll build --strict_front_matter --destination ../_site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # lod-data.json, extract/, json/, api/ and rdf/ (the old dynamic URLs)
      - name: Export data files
        run: python scripts/export_site_data.py _site

      - name: Every dataset has its pages and files
        run: python scripts/check_site_paths.py _site

      - name: Internal links resolve
        run: python scripts/check_site_links.py _site

      # Tarred first: upload-artifact rejects file names containing ":" and
      # 28 dataset identifiers contain one.
      - name: Archive site
        run: tar czf site.tar.gz -C _site .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar.gz
          retention-days: 7
