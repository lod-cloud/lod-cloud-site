name: Site

# Builds the Jekyll site in site/ and the data files from data/datasets, and checks it. A push
# to main also publishes it to GitHub Pages (the `deploy` job), as the exact site that was
# checked. Pages is at https://lod-cloud.github.io/lod-cloud-site/; lod-cloud.net is served
# from it by a reverse proxy (#105).
#
# Repository variable PAGES_BASEURL: "/lod-cloud-site" while the site is only previewed at that
# address (every link then includes the prefix, and pages say noindex); empty once the proxy
# serves it at the root of lod-cloud.net.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No LFS: the site's own images are stored normally, and the old
      # versions/ images (several GB in LFS) are not needed to build it.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Which datasets are flagged as unavailable comes from the link check's results
      # (the Links workflow, on the link-status branch). Before the first check there are none.
      - name: Link status
        run: |
          if git fetch -q --depth 1 origin link-status; then
            git show FETCH_HEAD:resources.json > resources.json
          fi
          python scripts/availability.py --state resources.json --out site/_data/availability.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site

      - name: Build
        working-directory: site
        env:
          BASEURL: ${{ vars.PAGES_BASEURL }}
        run: |
          printf 'baseurl: "%s"\ncloud_base: "%s"\n' "$BASEURL" "$BASEURL" > "$RUNNER_TEMP/baseurl.yml"
          bundle exec jekyll build --strict_front_matter --config _config.yml,"$RUNNER_TEMP/baseurl.yml" --destination ../_site

      # lod-data.json, extract/, json/, api/, rdf/, ttl/ and nt/ (the old dynamic URLs)
      - name: Export data files
        run: python scripts/export_site_data.py _site

      # The search index of the dataset pages (site/search/), written to _site/pagefind/
      - name: Search index
        run: npx --yes pagefind@1.4.0 --site _site

      # The current diagram set, from its GitHub release (the site serves it under /clouds/)
      - name: Current diagrams
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_clouds.py _site/clouds

      - name: Every dataset has its pages and files
        run: python scripts/check_site_paths.py _site

      - name: Internal links resolve
        env:
          BASEURL: ${{ vars.PAGES_BASEURL }}
        run: python scripts/check_site_links.py _site --baseurl "$BASEURL"

      # Tarred first: upload-artifact rejects file names containing ":" and
      # 28 dataset identifiers contain one.
      - name: Archive site
        run: tar czf site.tar.gz -C _site .

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site.tar.gz
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: _site

  # Only the main branch is published. Needs Pages set to "GitHub Actions" in the settings.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
