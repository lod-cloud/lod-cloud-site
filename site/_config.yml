title: The Linked Open Data Cloud
description: The Linked Open Data Cloud Diagram
author: John P. McCrae

# Where the site is published. Both change at cutover (#105).
url: https://lod-cloud.net
baseurl: ""

github_repo: lod-cloud/lod-cloud-site
github_url: https://github.com/lod-cloud/lod-cloud-site
github_branch: main
submit_url: https://github.com/lod-cloud/lod-cloud-site/issues/new/choose

# Dataset records, relative to this directory (see _plugins/lodcloud.rb).
dataset_dir: ../data/datasets

# Where the diagrams (clouds/) are served from. The build downloads the current set from its
# GitHub release into the site (scripts/fetch_clouds.py), so this is "" (the site itself).
# A preview under a path (baseurl) sets both; see site/README.md.
cloud_base: ""

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
